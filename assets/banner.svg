<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }
    .stat-num {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #38bdf8;
    }

    /* Subtle Animated Elements */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.6; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.7; }
      100% { transform: translateY(340px); opacity: 0.2; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes signalBlink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -100; }
    }

    .pulse-orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .pulse-orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 240px; }
    .scan-beam { animation: scanLine 6s linear infinite; }
    .float-item-1 { animation: floatPill 5s ease-in-out infinite; }
    .float-item-2 { animation: floatPill 6s ease-in-out infinite 1s; }
    .float-item-3 { animation: floatPill 7s ease-in-out infinite 2s; }
    .signal-dot { animation: signalBlink 2s ease-in-out infinite; }
    .data-flow { stroke-dasharray: 6 6; animation: dashCycle 2.5s linear infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16" />

  <!-- Technical Background Grid -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />

    <line x1="80" y1="0" x2="80" y2="340" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="360" y1="0" x2="360" y2="340" />
    <line x1="520" y1="0" x2="520" y2="340" />
    <line x1="680" y1="0" x2="680" y2="340" />
    <line x1="840" y1="0" x2="840" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
    <line x1="1120" y1="0" x2="1120" y2="340" />
  </g>

  <!-- Dynamic Glowing Orbs in Background (Non-intrusive) -->
  <g>
    <circle cx="180" cy="80" r="140" fill="url(#accentGlow)" class="pulse-orb-1" filter="url(#glow)" />
    <circle cx="1020" cy="260" r="160" fill="url(#accentGlow)" class="pulse-orb-2" filter="url(#glow)" />
  </g>

  <!-- Animated Architecture Flow Lines (Right Side Background) -->
  <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" fill="none">
    <path d="M 720 170 H 840 Q 870 170 870 130 V 90 Q 870 70 900 70 H 1080" class="data-flow" />
    <path d="M 720 170 H 840 Q 870 170 870 210 V 250 Q 870 270 900 270 H 1080" class="data-flow" />
    <line x1="720" y1="170" x2="1080" y2="170" class="data-flow" stroke="#818cf8" stroke-opacity="0.4" />
  </g>

  <!-- Subtle Scanning Laser Line -->
  <g class="scan-beam">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- Floating Dynamic Tech Cards (Right side decorative elements) -->
  <g class="float-item-1" filter="url(#dropShadow)">
    <rect x="910" y="48" width="220" height="44" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="932" cy="70" r="5" fill="#10b981" class="signal-dot" />
    <text x="948" y="75" class="badge-text">RMM &amp; Endpoint Telemetry</text>
  </g>

  <g class="float-item-2" filter="url(#dropShadow)">
    <rect x="910" y="148" width="220" height="44" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="932" cy="170" r="5" fill="#38bdf8" class="signal-dot" />
    <text x="948" y="175" class="badge-text">Infrastructure Observability</text>
  </g>

  <g class="float-item-3" filter="url(#dropShadow)">
    <rect x="910" y="248" width="220" height="44" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="932" cy="270" r="5" fill="#f59e0b" class="signal-dot" />
    <text x="948" y="275" class="badge-text">Config &amp; Fleet Orchestration</text>
  </g>

  <!-- Main Content Foreground (High Contrast & Clear) -->
  <g transform="translate(60, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 52)">
      <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="16" cy="14" r="4" fill="#38bdf8" />
      <text x="28" y="19" class="badge-text" fill="#38bdf8" letter-spacing="1">CURATED IT &amp; SYSADMIN</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title-text">
      Awesome Systems Administration
    </text>
    <text x="0" y="176" class="title-text" fill="url(#primaryGrad)">
      &amp; Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="218" class="subtitle-text">
      The authoritative index of enterprise RMM, endpoint management,
    </text>
    <text x="0" y="242" class="subtitle-text">
      open-source fleet administration, and infrastructure automation tools.
    </text>

    <!-- Feature Quick Pills -->
    <g transform="translate(0, 268)">
      <!-- Pill 1 -->
      <g>
        <rect width="115" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" class="badge-text">💻 RMM &amp; MDM</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(125, 0)">
        <rect width="130" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" class="badge-text">⚡ Infrastructure</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(265, 0)">
        <rect width="110" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" class="badge-text">🚀 Automation</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(385, 0)">
        <rect width="140" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="14" y="21" class="badge-text">🛡️ Self-Hosted OSS</text>
      </g>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="339" rx="16" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />
</svg>